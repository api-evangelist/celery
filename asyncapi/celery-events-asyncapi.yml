asyncapi: 3.0.0
info:
  title: Celery Worker Event Stream
  version: '5.6.3'
  description: >-
    Celery workers publish a monitoring event stream over the configured broker. This document is a
    faithful transcription of the published Event Reference in the Celery Monitoring and Management
    Guide — every channel, message and field below is named in that page and nothing has been added.


    IMPORTANT PROVENANCE: this AsyncAPI document was AUTHORED BY API EVANGELIST from Celery's
    documentation. Celery does not publish an AsyncAPI specification. It is a derivation, not a
    provider artifact — see x-generated-from below.


    The stream is off by default: it requires the worker to be started with -E/--task-events, or
    events to be enabled at runtime with `celery -A proj control enable_events`. task-sent
    additionally requires the task_send_sent_event setting. Events are published to the `celeryev`
    topic exchange on AMQP brokers; the event routing key is the event type name.
  license:
    name: BSD-3-Clause
    url: https://github.com/celery/celery/blob/main/LICENSE
  externalDocs:
    description: Celery Monitoring and Management Guide — Event Reference
    url: https://docs.celeryq.dev/en/stable/userguide/monitoring.html#event-reference
