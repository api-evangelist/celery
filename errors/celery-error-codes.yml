note: >-
  Celery ships no HTTP surface, so there is no RFC 9457 problem+json envelope and no numeric error
  registry. Its published error contract is the `celery.exceptions` hierarchy — Python exception
  classes raised to callers and workers, transcribed verbatim from the API reference. Transport
  failures surface as kombu.exceptions.OperationalError, which deliberately does NOT inherit from
  CeleryError; pool failures come from billiard.
