  docs_channel: >-
    Documentation is published per series at docs.celeryq.dev/en/stable/ (current stable) with a
    separate development channel; every page carries a "This document describes the current stable
    version of Celery (5.6)" banner linking to the development docs.
  in_url: false
  note: >-
    Version is selected by the pinned package version, not by a URL path or request header — there
    is no wire API to version.
deprecation:
  policy_published: true
  policy_url: https://docs.celeryq.dev/en/stable/internals/deprecation.html
  title: Celery Deprecation Time-line
  form: >-
    A published, per-major-version removal time-line. It names each symbol scheduled for removal and
    the release that removes it, and gives the migration for each — e.g. `celery.decorators` and
    `celery.task` removed in 5.0, with `from celery import shared_task` as the replacement; the old
    classmethod-based Task API (MyTask.delay) removed in favour of instantiating the task.
  sunset_headers: na — no HTTP surface, so RFC 8594 Sunset/Deprecation headers do not apply
  runtime_signal: >-
    Deprecations are signalled in-process by CDeprecationWarning and CPendingDeprecationWarning
    (celery.exceptions), which is the library-native equivalent of a Deprecation header.
  sections:
    - Removals for version 5.0 (old Task API, compat task modules, task attributes, modules, settings, BROKER_* settings, REDIS result-backend settings, task_sent signal)
    - Removals for version 2.0
support:
  policy_url: https://github.com/celery/celery/blob/main/SECURITY.md
  form: >-
    SECURITY.md publishes a Supported Versions table. As checked 2026-09-05 the table still lists
    5.4.x as the only supported line and marks 5.3.x and below unsupported — it has not been updated
    for the 5.5/5.6 series that shipped since, so the published support matrix is stale relative to
    the releases.
  supported_versions_as_published:
