description: >-
  Celery publishes no commercial plans, tiers or pricing, and there is nothing to buy. It is a
  BSD-3-Clause licensed open-source library that the consumer installs and runs on their own
  infrastructure; there is no hosted service, no account, no metering and no billing relationship.
  An honest zero here is the correct measurement, not a gap.
note: >-
  This file REPLACES a fabricated scaffold written by the 2026-05-04 bulk sweep, which invented
  Free / Professional / Enterprise tiers with request quotas, per-minute rate limits and overage
  pricing. None of that exists. Celery has no request quota because it has no requests — it is a
  library, not a service.
